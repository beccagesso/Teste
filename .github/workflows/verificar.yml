name: Verificar o index.html

# O index.html é montado a partir de build/template.html pelo build/gerar.py.
# Se alguém editar o index.html direto, a mudança se perde na próxima geração.
# Este teste avisa quando os dois saem de sincronia.

on:
  push:
    branches:
      - claude/becca-gesso-iphone-app-yuxcjz
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: O index.html confere com o template?
        run: |
          python3 build/gerar.py
          if ! git diff --quiet -- index.html; then
            echo "::error::O index.html está diferente do que build/gerar.py produz."
            echo "Rode 'python3 build/gerar.py' e faça commit do index.html gerado."
            git diff --stat -- index.html
            exit 1
          fi
          echo "index.html confere com build/template.html."

      # O que faz o app quebrar sem internet é BAIXAR alguma coisa de fora:
      # uma fonte, um script, uma folha de estilo, uma imagem. Um endereço
      # que o app só abre em outra aba (WhatsApp) ou chama de propósito e
      # sabe viver sem (Supabase) não impede o app de abrir offline.
      #
      # A conferência antiga proibia qualquer endereço no arquivo, o que
      # passou a acusar os links do WhatsApp. Agora são duas conferências
      # separadas, cada uma medindo o que interessa.
      - name: O app baixa alguma coisa de fora?
        run: |
          achados=$(grep -Eo '(src|href)="https?://[^"]*"|@import|url\(https?:' index.html || true)
          if [ -n "$achados" ]; then
            echo "::error::O index.html está baixando algo de fora e não abriria sem internet."
            echo "$achados"
            exit 1
          fi
          echo "Nada é baixado de fora: o app abre sem internet."

      - name: Só endereços conhecidos aparecem no arquivo?
        run: |
          # wa.me      -> abre a conversa do WhatsApp em outra aba
          # supabase   -> a nuvem, que é opcional e tem queda para offline
          # github.com -> comentários e documentação
          inesperados=$(grep -Eo 'https?://[^"'"'"' )]+' index.html \
            | grep -Ev '^https?://(wa\.me|[a-z0-9-]*\.?supabase\.(co|in)|github\.com)' \
            | sort -u || true)
          if [ -n "$inesperados" ]; then
            echo "::error::Apareceu endereço externo que ninguém previu."
            echo "$inesperados"
            exit 1
          fi
          echo "Só os endereços previstos aparecem no arquivo."
