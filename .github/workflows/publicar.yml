name: Publicar no GitHub Pages

on:
  push:
    branches:
      - claude/becca-gesso-iphone-app-yuxcjz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true liga o GitHub Pages sozinho na primeira execução,
      # sem precisar mexer nas configurações do repositório.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Conferir se o index.html está atualizado
        run: |
          python3 build/gerar.py
          if ! git diff --quiet -- index.html; then
            echo "::error::O index.html está diferente do que build/gerar.py produz."
            echo "Rode 'python3 build/gerar.py' e faça commit do resultado."
            git diff --stat -- index.html
            exit 1
          fi
          echo "index.html confere com o template."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
